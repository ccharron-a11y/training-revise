<script data-for="cmp_list" data-template="cmp_list" type="text/x-handlebars-template">
    {{#* inline "listitem"}}
        <div class="item-marker">
            <span class="screenreader screenreader-marker-label" id="{{uid}}-bullet-label"></span>
            {{> @partial-block }}
            {{#if @root.isChecklist}}
            <input id="{{uid}}-checkbox" type="checkbox" class="item-checkbox" value="{{index}}" aria-describedby="{{uid}}-bullet-label {{uid}}-content" {{#if mandatory}}aria-required="true" {{/if}}{{#if completed}}checked{{/if}}/>
            <label for="{{uid}}-checkbox">
    			<span class="input-ui" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" focusable="false">
                        <use href='#icon_tick' />
                    </svg>
                </span>
                <!-- <div class="item-text">{{{settext content}}}</div> -->
            </label>
            {{/if}}
        </div>
        <div class="item-text" id="{{uid}}-content">{{{settext content}}}</div>
    {{/inline}}

    {{#* inline "list-unordered"}}
        <div class="cmp_list-list cmp_list-typeunordered" role="list" {{#if @root.isChecklist}}aria-label="{{translate 'Checklist'}}"{{/if}}>
        {{#each items}}
            <div role="listitem" class="cmp_list-item{{#unless @root.hasShape}} no-background{{/unless}}{{#unless @root.hasThumbnail}} no-thumbnail{{/unless}}{{#if @root.isChecklist}} is-checklist{{/if}}" style="{{style}}">
                {{#> listitem}}
                <span class="item-bullet style-{{@root.itemstyle}} shape-{{itemshape}}" aria-hidden="true">
                    <svg class="list-bullet-shape" width="24" height="24" viewBox="0 0 24 24" focusable="false">
                        <use href='#shape_{{itemshape}}' />
                    </svg>
                    {{#if hasThumbnail}}
                        {{{thumbnail}}}
                    {{/if}}
                </span>
                {{/ listitem}}
            </div>
        {{/each}}
        </ul>
    {{/inline}}

    {{#* inline "list-ordered"}}
        <div class="cmp_list-list  cmp_list-typeordered" data-start="{{startnumber}}" role="list" {{#if @root.isChecklist}}aria-label="{{translate 'Checklist'}}"{{/if}}>
        {{#each items}}
            <div role="listitem" class="cmp_list-item {{#unless @root.hasShape}}no-background{{/unless}}{{#if @root.isChecklist}} is-checklist{{/if}}" style="{{style}}">
                {{#> listitem}}
                <span class="item-bullet style-{{@root.itemstyle}} shape-{{itemshape}}" aria-hidden="true">
                    <svg class="list-bullet-shape" width="24" height="24" viewBox="0 0 24 24" focusable="false">
                        <use href='#shape_{{itemshape}}' />
                    </svg>
                </span>
                {{/ listitem}}
            </div>
        {{/each}}
        </div>
    {{/inline}}

    <div style="{{style}}">
        {{> (getListType)}}
    </div>
</script>

<script data-for="mdl_indexpanel" data-template="navbutton" type="text/x-html-template">

    	<svg class="item-icon" width="24" height="24" viewBox="0 0 24 24" focusable="false">

    	</svg>
    	<span class="label">{{translate "Index"}}</span>
    </button>

<script data-for="mdl_indexpanel" data-template="indexpanel" type="text/x-html-template">

    {{#* inline "pageslist"}}
    	{{#each pages}}
    		<li data-number='{{number}}' class='index-list-item' >
    			<button type="button" class='{{classes}}' data-index='{{index}}' {{#if current}}aria-current="page"{{/if}} {{#if disabled}}aria-disabled="true" readonly{{/if}}>
    				{{title}}
    				<svg class="item-complete-icon" width="18" height="18" viewBox="0 0 24 24" focusable="false" aria-describedby="index-svg-icon-complete-{{index}}">
    					<title id="index-svg-icon-complete-{{index}}">{{translate "Page complete"}}</title>
    					<use xlink:href="#icon_tick" />
    				</svg>
    			</button>
    		</li>
    	{{/each}}
    {{/inline}}

    <div class='index-panel-wrap panel-wrap' role='dialog'>
    	<div class='index-panel panel scroll-shadows' role='menu'>
    		<div class='index-list-holder panel-content'>
    			<h1 tabindex="-1" class="panel-title">{{translate "Index"}}</h1>
    			<ul aria-label='Index' class='index-list'>
    				{{#each groups}}
    				<li>
    					{{#if ../pagesOnly}}
    						{{> pageslist}}
    					{{/if}}
    					{{#if ../groupsOnly}}
    						<li data-number='{{number}}' class='index-list-item' >
    							<button type="button" class='{{groupclasses}}' data-index='{{grouppageindex}}' {{#if groupdisabled}}aria-disabled="disabled" readonly{{/if}}>
    								{{groupname}}
    								<svg class="item-complete-icon" width="18" height="18" viewBox="0 0 24 24" focusable="false" aria-describedby="index-svg-icon-complete-{{groupindex}}">
    									<title id="index-svg-icon-complete-{{groupindex}}">{{translate "Section complete"}}</title>
    									<use xlink:href="#icon_tick" />
    								</svg>
    							</button>
    						</li>
    					{{/if}}
    					{{#if ../pagesAndGroups}}
    						{{#if ../multiplegroups}}
    						<ul class='index-group-list'>
    							<li>
    								<h2 class='group-header'>
    									<span role="text">
    										<span class="screenreader">{{translate "Section"}} - </span>
    										<span>{{groupname}}</span>
    									</span>
    								</h2>
    							</li>
    							{{> pageslist}}
    						</ul>
    						{{else}}
    							{{> pageslist}}
    						{{/if}}
    					{{/if}}

    				</li>
    				{{/each}}
    			</ul>
    		</div>
    	</div>
    	<div class="close-panel-parent">
    		<button type="button" class='index-close index-close-button panel-close-button'>
    			<svg width="24" height="24" viewBox="0 0 24 24" focusable="false" aria-describedby="index-svgicon-close">
    				<title id="index-svgicon-close">{{translate "Close"}}</title>
    				<use xlink:href="#icon_cross" />
    			</svg>
    			<!-- <span class="label">{{translate "Close"}}</span> -->
    		</button>
    	</div>
    	<button type="button" class='index-close index-close-full-page panel-close-full-page' tabindex='-1' aria-hidden='true'></button>
    </div>
</script>

<script data-for="mdl_languagePicker" data-template="languagePicker" type="text/x-html-template">
<div class="language-picker">
    <button class="language-picker-button button-general" aria-expanded="false" aria-controls="language-picker-dropdown" tabindex="0">
        <span class="language-picker-flag language-picker-flag--{{lang}}" aria-hidden="true" ></span>
        <span class="language-picker-button-label">{{name}}</span>
        <span class="screenreader">, {{translate "Select your language"}}</span>
    </button>
    <div class="language-picker-dropdown" aria-describedby="language-picker-description" id="language-picker-dropdown">
        <p class="screenreader language-picker-description">{{translate "Select your language"}}</p>
        <ul class="language-picker-list" role="listbox">
        {{#each supportedLanguages}}
            <li>
                <a lang="{{htmlCode}}" hreflang="{{htmlCode}}" href="#" role="option" data-value="{{langCode}}" class="language-picker-item language-picker-flag language-picker-flag--{{langCode}}"{{#if selected}} aria-selected="true"{{/if}}>
                    <span class="language-picker-item-label">{{name}}</span>
                    {{#if selected}}
                        <svg class="language-picker-item-tick" width="24" height="24" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                            <use xlink:href='#icon_tick' />
                        </svg>
                    {{/if}}
                </a>
            </li>
        {{/each}}
        </ul>
    </div>
</div>
</script>

    			</li>
    		{{/each}}
    	</ul>
    </div>
</script>

<script data-for="mdl_menu" data-template="navbutton" type="text/x-html-template">
    <button type="button" class="menu-button" aria-expanded="false" title="{{translate "Menu"}}">
        <svg class="item-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false" aria-describedby="menu-svg-icon-menu">
            <title id="menu-svg-icon-menu">{{translate "Menu"}}</title>
            <use xlink:href="#icon_index" />
        </svg>
        <span class="label" aria-hidden="true">{{translate "Menu"}}</span>
    </button>
</script>

<script data-for="mdl_menu" data-template="menu" type="text/x-html-template">
    <div class="menu-panel-wrap panel-wrap">
        <div class="menu-panel panel" role="menu">
            <div class="panel-header" style="background-image:{{themebanner}}">
                <h1 tabindex="-1" class="panel-title">{{moduleTitle}}</h1>
                <div class="tablist" role="tablist" aria-label="Menu items">
                    {{#each tabs}}
                        <button id="tab-item-{{mod}}" class="tabpanel-tab" data-module="{{mod}}" aria-selected="false" aria-controls="tab-content-{{mod}}" role="tab">{{{content}}}</button>
                    {{/each}}
                </div>
            </div>
            <div class="panel-content scroll-shadows">
                {{#each tabs}}
                    <div id="tab-content-{{mod}}" class="tabpanel-panel" tabindex="0" aria-selected="false" aria-labelledby="tab-item-{{mod}}" aria-controls="tab-content={{mod}}" role="tabpanel" aria-hidden="false"></div>
                {{/each}}
            </div>
            {{#if aiDisclosure}}
            <div class="menu-ai-disclosure">{{{aiDisclosure}}}</div>
            {{/if}}
            <div class="close-panel-parent">
                <button type="button" class='menu-close menu-close-button panel-close-button' title="{{translate 'Close menu'}}">
                    <svg width="24" height="24" viewBox="0 0 24 24" focusable="false" aria-describedby="menu-svgicon-close">
                        <title id="menu-svgicon-close">{{translate "Close menu"}}</title>
                        <use xlink:href="#icon_cross" />
                    </svg>
                    <!-- <span>{{translate 'Close menu'}}</span> -->
                </button>
            </div>
        </div>

        <button type="button" class='menu-close menu-close-full-page panel-close-full-page' tabindex='-1' aria-hidden='true'></button>
    </div>
</script>

<!-- template for reference number -->
<script data-for="mdl_referencesmanager" data-template="shortcode_numbers" type="text/x-html-template">
    {{#each references}}
        {{#if ../linknumbers}}
        <sup>
            <a class="rm-link {{classes}}" rel="reference" data-refid="{{id}}" data-target="{{link}}" href="#" role="button">
               <span class="screenreader">{{translate "Citation"}}: {{link}} {{translate "Click to view"}}</span>
               <span class="rm-number" aria-hidden="true">{{number}}</span>
            </a>
        </sup>
        {{else}}
        <sup class="rm-number {{classes}}" data-refid="{{id}}">
            <span class="screenreader">{{translate "Citation"}}: {{link}} {{translate "Go to the menu to read the reference."}}</span>
            <span class="rm-number" aria-hidden="true">{{number}}</span>
        </sup>
        {{/if}}
    {{/each}}
</script>

<!-- references list template -->
<script data-for="mdl_referencesmanager" data-template="list" type="text/x-html-template">
    {{#if showalltoggle}}
    <div class="rm-showall-toggle">
        <input type="checkbox" class="rm-showall rm-showall-input" id="ref-show-all-toggle" data-for="{{listid}}" />
        <label for="ref-show-all-toggle" class="ref-showall-label"><span class="rm-showall-toggle-indicator"></span><span>{{translate "Show all references"}}</span></label>
    </div>
    {{/if}}
    <ol class="rm-list {{classes}}" data-listid="{{listid}}">
    {{#each references}}
        <li class="rm-item {{classes}}" data-refid="{{id}}"><div class="rm-item-content">{{{text}}}</div></li>
    {{/each}}
    </ol>
</script>

<!-- references no references -->
<script data-for="mdl_referencesmanager" data-template="no_references" type="text/x-html-template">
    <p data-listid="{{listid}}">{{translate "No references available."}}</p>
</script>

<!-- references no citations -->
<script data-for="mdl_referencesmanager" data-template="no_citations" type="text/x-html-template">
    <p data-listid="{{listid}}">{{translate "No citations have been found on the page."}}</p>
</script>

<!-- glossary term template -->
<script data-for="mdl_glossarymanager" data-template="term" type="text/x-html-template">
    <a href="#" class="glossary-term" data-termuid="{{uid}}"><span class="screenreader">{{translate "{{term}} (Click to view definition for {{term}})"}}</span><span aria-hidden="true">{{term}}</span></a>
</script>

<!-- module wide AI disclosure, shown on the intro and in the menu -->
<script data-for="mdl_aidisclosure" data-template="notice" type="text/x-html-template">
    <p class="ai-disclosure ai-disclosure-{{kind}}">
        <svg class="ai-disclosure-icon" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true"><use xlink:href="#icon_ai_label" /></svg>
        <span class="ai-disclosure-text">{{#if generated}}{{translate "This module contains AI-generated content."}}{{else}}{{translate "This module contains content modified using AI."}}{{/if}}</span>
    </p>
</script>

<!-- AI badge on a media component, the message shows on hover and focus -->
<script data-for="mdl_aidisclosure" data-template="badge" type="text/x-html-template">
    <span class="ai-badge ai-badge-{{kind}}">
        <button type="button" class="ai-badge-button" aria-describedby="ai-badge-message-{{uid}}">
            <svg class="ai-disclosure-icon" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true"><use xlink:href="#icon_ai_label" /></svg>
            <span class="screenreader">{{translate "AI content"}}</span>
        </button>
        <span class="ai-badge-message" id="ai-badge-message-{{uid}}" role="tooltip">
            {{#if video}}
                {{#if generated}}{{translate "This video contains AI-generated content."}}{{else}}{{translate "This video contains content modified using AI."}}{{/if}}
            {{else}}
                {{#if generated}}{{translate "This audio contains AI-generated content."}}{{else}}{{translate "This audio contains content modified using AI."}}{{/if}}
            {{/if}}
        </span>
    </span>
</script>
